<div>
  <mat-accordion>
    <mat-expansion-panel style="background-color: #7f7c78;">
      <mat-expansion-panel-header>
        <mat-panel-title style=" color:black;font-weight: bolder; font-size: 20px;">
          Consulta de Pagos
        </mat-panel-title>
        <mat-panel-description>
        </mat-panel-description>
      </mat-expansion-panel-header>
      <div *ngIf="pagosService.mostrarTabla">
      <table mat-table [dataSource]="pagosService.dataSource" class="mat-elevation-z8">
  
        <ng-container matColumnDef="Concepto">
          <th mat-header-cell *matHeaderCellDef> Concepto </th>
          <td mat-cell *matCellDef="let element"> {{element.Concepto}} </td>
        </ng-container>
      
        <!-- Name Column -->
        <ng-container matColumnDef="Cant_Productos">
          <th mat-header-cell *matHeaderCellDef> Cant_Productos </th>
          <td mat-cell *matCellDef="let element"> {{element.Cant_Productos}} </td>
        </ng-container>
      
        <!-- Weight Column -->
        <ng-container matColumnDef="Cliente">
          <th mat-header-cell *matHeaderCellDef> Cliente </th>
          <td mat-cell *matCellDef="let element"> {{element.Cliente}} </td>
        </ng-container>
      
        <!-- Symbol Column -->
        <ng-container matColumnDef="Empleado">
          <th mat-header-cell *matHeaderCellDef> Empleado </th>
          <td mat-cell *matCellDef="let element"> {{element.NombreEmpleado}} </td>
        </ng-container>
        <ng-container matColumnDef="Monto">
          <th mat-header-cell *matHeaderCellDef> Monto </th>
          <td mat-cell *matCellDef="let element"> {{element.Total}} </td>
        </ng-container>
        <ng-container matColumnDef="Estatus">
          <th mat-header-cell *matHeaderCellDef> Estatus </th>
          <td mat-cell *matCellDef="let element">
            <mat-form-field>
              <mat-label>{{element.Estatus}}</mat-label>
              <mat-select  (selectionChange)="pagosService.ActualizaEstatus($event)" [(ngModel)]="element.Estatus" name="EstatusP" #EstatusP>
                <mat-option value="0,{{element.PagoID}}">Pagado</mat-option>
                <mat-option value="1,{{element.PagoID}}">NoProcesado</mat-option>
                <mat-option value="2,{{element.PagoID}}">Cancelado</mat-option>
              </mat-select>
            </mat-form-field>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="pagosService.displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: pagosService.displayedColumns;"></tr>
      </table>
    </div>
    <div *ngIf="pagosService.mostrarLoadTabla" style="align-self: center;text-align: -webkit-center;">
    <mat-spinner></mat-spinner>
  </div>
    </mat-expansion-panel>
  </mat-accordion>
</div>
